<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="44" height="44" role="img" aria-label="Kovács Bence">
  <!-- Helyőrző a könyvelő valódi fotója helyett (nem rajzolt arc). A betű a UI betűtípusa: inline SVG-ben a --betu-szoveg
       változót követi, önálló képként a felsorolt tartalékra esik vissza. Szín: tokens.css --gomb-m-alap / --tintakek. -->
  <circle cx="44" cy="44" r="44" fill="#D6E0F0"/>
  <text x="44" y="45" text-anchor="middle" dominant-baseline="central" fill="#17284A"
        style="font-family: var(--betu-szoveg, Inter, 'Segoe UI', Arial, sans-serif); font-weight: 700; font-size: 32px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums;">KB</text>
</svg>
