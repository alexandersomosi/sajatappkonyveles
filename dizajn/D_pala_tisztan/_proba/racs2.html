<!doctype html><html lang="hu"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;700&family=Sofia+Sans+Condensed:wght@600;700&display=block" rel="stylesheet">
<style>
body{margin:0;padding:16px;background:#DAE3E5;color:#132326;font-family:"Sofia Sans";display:flex;gap:16px;align-items:flex-start}
.sheet{width:358px;background:#fff;border-radius:14px;overflow:hidden;padding:16px 0}
.k{background-color:#FBFDFD;background-image:linear-gradient(#DCE8EA 1px,transparent 1px),linear-gradient(90deg,#DCE8EA 1px,transparent 1px);background-size:18px 18px;background-position:17px 0;padding:0 17px 18px;border-top:1px solid #D3DDDF;border-bottom:1px solid #D3DDDF}
.hd{height:36px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700}
.hd span{font-weight:400;color:#536569;font-size:14px}
.r{display:grid;grid-template-columns:18px 198px 108px;height:18px;line-height:18px}
.op{font-weight:700;color:#536569;text-align:center;font-size:16px}
.lab{font-size:15px;padding-left:3px;white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums;font-size:17px;padding-right:1px}
.ul .n{box-shadow:0 1.5px 0 #132326}
.ulf{box-shadow:0 1.5px 0 #132326}
.dul .n{box-shadow:0 1.5px 0 #132326, 0 4.5px 0 #FBFDFD, 0 6px 0 #132326}
.b .lab,.b .n{font-weight:700}
.gap{height:18px}
.fn{font-size:14px;color:#536569;line-height:18px;margin-top:18px}
.v2 .r{height:27px;line-height:27px}
</style></head><body>
<div class="sheet"><div class="k" id="a"></div></div>
<div class="sheet"><div class="k" id="b"></div></div>
<script>
const rows=[['','Bevétel','2&#8239;940&#8239;000'],['−','40% költséghányad','1&#8239;176&#8239;000','ul'],['=','Jövedelem','1&#8239;764&#8239;000','b'],['gap'],['×','15% SZJA-előleg','264&#8239;600'],['×','18,5% TB-járulék','326&#8239;340'],['×','13% szocho','229&#8239;320','ul'],['=','Fizetendő','820&#8239;260','b dul']];
const hd='<div class="hd">Hogyan jött ki? <span>július–szeptember</span></div>';
const fn='<div class="fn">Az idei adómentes részed a második negyedévben elfogyott, ezért most a teljes jövedelem után jár SZJA.</div>';
document.getElementById('a').innerHTML=hd+rows.map(r=>r[0]=='gap'?'<div class="gap"></div>':`<div class="r ${r[3]||''}"><span class="op">${r[0]}</span><span class="lab">${r[1]}</span><span class="n">${r[2]}</span></div>`).join('')+fn;
const rows2=rows.filter(r=>r[0]!='gap').map(r=>[r[0],r[1],r[2],(r[3]||'').replace('ul','ulx')]);
document.getElementById('b').innerHTML=hd+rows.map(r=>r[0]=='gap'?'<div class="gap"></div>':`<div class="r ${(r[3]||'').replace(/\bul\b/,'ul ulf')}"><span class="op">${r[0]}</span><span class="lab">${r[1]}</span><span class="n">${r[2]}</span></div>`).join('')+fn;
</script></body></html>
