<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Adózz – Adószám (választott)</title>
<link rel="stylesheet" href="../../C2_modern/app_v2/tokens.css">
<link rel="stylesheet" href="../../C3_zold/kek.css">
<style>
  /* C4 / A irány – űrlap ugyanazokkal a szabályokkal (2026-11-19): 3D ikon + kék cím, egy mondat, egy nagy mező;
     a „Hol találom?” kör alakú „i” gomb; a talált vállalkozás felugró kártyán; egyetlen szöveges link („Most nem tudom”);
     a fő gomb („Tovább”) ugyanott, ahol a főoldalon: teljes szélesség, a fülsor fölött rögzítve. Az adatok kitaláltak. */
  :root { --kek-szoveg: #1226B8; }
  body { padding-bottom: 190px; }

  /* felső sáv: vissza (szöveges kapszula, nem nyíl), középen a lépés neve */
  .felso { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; position: relative; }
  .felso .hol { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 650; letter-spacing: -.01em; pointer-events: none; }
  .vissza { position: relative; display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px;
    background: rgba(16,21,43,.06); color: var(--tinta); font-weight: 600; font-size: 15.5px; z-index: 1; }
  .vissza::after { content: ""; position: absolute; inset: -4px; }
  .demo { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 6px;
    background: #F7E8C6; color: #5E3B00; font-size: 13px; font-weight: 750; letter-spacing: .05em; z-index: 1; }

  .tart { padding: 22px 16px 0; }
  /* a szakasz eleje ugyanaz, mint a főoldal kártyáján: 3D ikon + kék cím egy sorban, alatta egy mondat */
  .cim-sor { display: flex; align-items: center; gap: 14px; }
  .cim-sor img.i3 { width: 52px; height: 52px; }
  .cim-sor h1 { flex: 1; min-width: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.024em; color: var(--neon); }
  .tart .egy { font-size: 17px; line-height: 1.5; color: var(--tinta); margin-top: 14px; }

  /* mező: egy nagy beviteli mező; fölötte a felirat és az „i” gomb egy sorban */
  .mezo-fej { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 26px; min-height: 44px; }
  .mezo-fej label { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  /* bíráló csiszolás (11-19): a „Hol találom?” ugyanolyan világoskék kapszula, mint a főoldal másodlagos gombjai,
     így nem második szöveges link; benne a kerek „i” fehér korong */
  .hol-gomb { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 15px 0 5px;
    border-radius: 999px; background: var(--gomb-m-alap); color: var(--kek-szoveg); font-weight: 650; font-size: 15.5px; }
  .hol-gomb::after { content: ""; position: absolute; inset: -2px -4px; }
  .info { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: #fff; color: var(--kek-szoveg); font-weight: 800; font-size: 16px; line-height: 1; }
  .nagy-mezo { display: flex; align-items: center; height: 66px; padding: 0 18px; margin-top: 4px; border-radius: 14px;
    background: #fff; box-shadow: inset 0 0 0 2px var(--neon);
    font-size: 25px; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums lining-nums; color: var(--tinta); }
  .nagy-mezo .kurzor { display: inline-block; width: 2px; height: 30px; background: var(--neon); margin-left: 2px; vertical-align: -6px; }

  /* felugró megerősítés: a mezőből nyílik (kis csúcs mutat rá), lebeg, ezért van árnyéka */
  .felugro { position: relative; margin-top: 14px; padding: 18px 18px 18px; background: #fff; border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(16,21,60,.05), 0 18px 36px -16px rgba(16,21,60,.5); }
  .felugro::before { content: ""; position: absolute; top: -7px; left: 30px; width: 16px; height: 16px; background: #fff;
    transform: rotate(45deg); border-radius: 3px 0 0 0; box-shadow: -1px -1px 0 0 rgba(16,21,60,.05); }
  .felugro .fej { display: flex; align-items: center; gap: 12px; }
  .felugro .fej img.i3 { width: 32px; height: 32px; }
  .felugro h2 { font-size: 19px; line-height: 1.25; font-weight: 700; letter-spacing: -.016em; color: var(--neon); }
  .felugro .adat { margin-top: 12px; font-size: 17px; line-height: 1.5; color: var(--tinta); }
  .felugro .adat b { font-weight: 650; }
  .felugro .adat span { display: block; }
  .felugro .nem { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; margin-top: 14px; border-radius: 999px;
    background: var(--nyomott); color: var(--tinta); font-weight: 600; font-size: 16px; box-shadow: inset 0 0 0 1px var(--hajszal); }

  /* az egyetlen szöveges link */
  .link { display: inline-block; margin-top: 14px; padding: 11px 0; font-size: 16px; font-weight: 550; line-height: 1.3;
    color: var(--kek-szoveg); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

  .fotogomb { box-shadow: inset 0 0 0 2px var(--neon), 0 10px 22px -8px rgba(16,21,60,.35); }
  .fo-gomb { position: fixed; left: 16px; width: 358px; bottom: 96px; z-index: 9; }
  .alj-fatyol { height: 176px; background: linear-gradient(to bottom, rgba(228,232,243,0) 0, var(--alap) 18px, var(--alap) 100%); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="terero" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.6" width="3" height="6.4" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></symbol>
  <symbol id="akku" viewBox="0 0 27 13"><rect x=".6" y=".6" width="22.6" height="11.8" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".45"/><rect x="2.4" y="2.4" width="17" height="8.2" rx="1.8"/><path d="M24.6 4.4v4.2c.9-.3 1.5-1.1 1.5-2.1s-.6-1.8-1.5-2.1z" opacity=".5"/></symbol>

<div class="felso">
  <button class="vissza">Vissza</button>
  <span class="hol">Vállalkozásod</span>
  <span class="demo">DEMO</span>
</div>

<main class="tart">
  <div class="cim-sor">
    <img class="i3" src="../../C2_modern/assets/ikon3d/igazolas_56@2x.png" srcset="../../C2_modern/assets/ikon3d/igazolas_56@2x.png 2x, ../../C2_modern/assets/ikon3d/igazolas_56@3x.png 3x" alt="">
    <h1>Add meg az adószámodat</h1>
  </div>
  <p class="egy">Ebből kikeressük az adataidat, neked csak ellenőrizned kell.</p>

  <div class="mezo-fej">
    <label for="adoszam">Adószám</label>
    <button class="hol-gomb" aria-label="Hol találom az adószámomat?"><span class="info">i</span>Hol találom?</button>
  </div>
  <div class="nagy-mezo" id="adoszam" role="textbox" aria-label="Adószám">12345678-1-41<span class="kurzor"></span></div>

  <section class="felugro" aria-labelledby="ez-cim">
    <div class="fej">
      <img class="i3" src="../../C2_modern/assets/ikon3d/befizetve_jel_44@2x.png" srcset="../../C2_modern/assets/ikon3d/befizetve_jel_44@2x.png 2x, ../../C2_modern/assets/ikon3d/befizetve_jel_44@3x.png 3x" alt="">
      <h2 id="ez-cim">Ez a te vállalkozásod?</h2>
    </div>
    <p class="adat"><b>Minta Márta e.v.</b><span>1136 Budapest, Példa utca 7.</span></p>
    <button class="nem">Nem, ez nem az enyém</button>
  </section>

  <a class="link">Most nem tudom</a>
</main>

<div class="alj-fatyol" aria-hidden="true"></div>
<button class="gomb-e fo-gomb">Igen, ez az enyém</button>

    <a class="ful on"><img class="i3 fooldal" src="../../C2_modern/assets/ikon3d/fooldal_36@2x.png" srcset="../../C2_modern/assets/ikon3d/fooldal_36@2x.png 2x, ../../C2_modern/assets/ikon3d/fooldal_36@3x.png 3x" alt="">Főoldal</a>
    <a class="ful"><img class="i3 dosszie" src="../../C2_modern/assets/ikon3d/dosszie_36@2x.png" srcset="../../C2_modern/assets/ikon3d/dosszie_36@2x.png 2x, ../../C2_modern/assets/ikon3d/dosszie_36@3x.png 3x" alt="">Dosszié</a>
    <a class="ful"><img class="i3 uzenetek" src="../../C2_modern/assets/ikon3d/uzenetek_36@2x.png" srcset="../../C2_modern/assets/ikon3d/uzenetek_36@2x.png 2x, ../../C2_modern/assets/ikon3d/uzenetek_36@3x.png 3x" alt="">Üzenetek</a>

  <button class="fotogomb" aria-label="Fotózás: irat lefotózása"><img class="i3" src="../../C2_modern/assets/ikon3d/fotozas_arnyektalan_36@2x.png" srcset="../../C2_modern/assets/ikon3d/fotozas_arnyektalan_36@2x.png 2x, ../../C2_modern/assets/ikon3d/fotozas_arnyektalan_36@3x.png 3x" alt="">Fotózás</button>
