<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kézjegy – Belépés</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* nincs sötét sáv és rálógó kártya: a szóvédjegy az alapon áll, alatta egy lap */
  .nyito { padding: 40px 22px 22px; }
  .szovegjel { font-family: var(--betu-cim); font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: .004em; color: var(--tintakek); }
  .nyito p { font-size: 16px; line-height: 1.4; color: var(--halvany-alapon); margin-top: 8px; }
  .belep { padding: 20px 18px 18px; }
  .pontok { letter-spacing: .18em; font-size: 15px; }
  .elfelejt { margin: 2px 0 10px; }
  /* Google és Apple: a két cég hivatalos, világos gombstílusa; a logót élesben a saját készletükből tesszük be */
  .masik { padding: 22px 4px 0; }
  .masik .mondat { font-size: 15px; line-height: 1.4; color: var(--halvany-alapon); margin: 0 0 10px; }
  .gomb-k { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: var(--r-gomb);
    background: #fff; color: #1F1F1F; font-weight: 600; font-size: 16px; font-stretch: 100%; }
  .gomb-k.google { border: 1px solid #747775; }
  .gomb-k + .gomb-k { margin-top: 10px; }
  .uj { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 15.5px; color: var(--tinta); }
</style>
</head>
<body>
<script src="kezjegy_utak.js"></script>
<script src="ikonok.js"></script>

<div class="allapotsor"><span>10:24</span><span class="jelek"><svg viewBox="0 0 18 12" width="18"><use href="#terero"/></svg><svg viewBox="0 0 27 13" width="27"><use href="#akku"/></svg></span></div>
<header class="nyito">
  <div class="szovegjel">Kézjegy</div>
  <p>Könyvelés egyéni vállalkozóknak</p>
</header>

<main class="tartalom sima">
  <section class="lap belep">
    <label class="mezo"><span class="felirat">E-mail-cím</span>
      <span class="doboz"><span class="ertek">szabo.kata@freemail.hu</span></span></label>
    <label class="mezo"><span class="felirat">Jelszó</span>
      <span class="doboz"><span class="ertek pontok">●●●●●●●●●●</span><button class="gomb-sz">Mutasd</button></span></label>
    <div class="elfelejt"><button class="gomb-sz">Elfelejtettem a jelszavam</button></div>
    <button class="gomb-e">Belépés</button>
  </section>

  <div class="masik">
    <p class="mondat">Ha Google- vagy Apple-fiókkal regisztráltál:</p>
    <button class="gomb-k google">Belépés Google-fiókkal</button>
    <button class="gomb-k apple">Belépés Apple-fiókkal</button>
  </div>
</main>

<div class="uj">Még nem vagy ügyfél? <button class="gomb-sz" style="font-size:15.5px">Regisztrálok</button></div>
<div class="otthon-jel"></div>
</body>
</html>
