<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1"><title>Adózz – Fotózás</title><link rel="stylesheet" href="v2.css"><style>.kamera .felso{position:absolute;left:16px;right:16px;top:54px;display:flex;align-items:center;justify-content:space-between}
.kamera .kerek{height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);font-weight:650;font-size:15px;display:flex;align-items:center}
.kamera .kap{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650}
.kamera .keret{position:absolute;left:9%;right:9%;top:128px;bottom:330px;background:#141A2B;border-radius:6px}
.kamera .keret i{position:absolute;width:30px;height:30px;border:0 solid rgba(255,255,255,.9)}
.kamera .keret i:nth-child(1){left:-4px;top:-4px;border-left-width:6px;border-top-width:6px;border-top-left-radius:8px}
.kamera .keret i:nth-child(2){right:-4px;top:-4px;border-right-width:6px;border-top-width:6px;border-top-right-radius:8px}
.kamera .keret i:nth-child(3){left:-4px;bottom:-4px;border-left-width:6px;border-bottom-width:6px;border-bottom-left-radius:8px}
.kamera .keret i:nth-child(4){right:-4px;bottom:-4px;border-right-width:6px;border-bottom-width:6px;border-bottom-right-radius:8px}
.kamera .tipp-sor{position:absolute;left:24px;right:24px;bottom:238px;text-align:center}
.kamera .tipp-sor b{display:block;font-size:15.5px}.kamera .tipp-sor span{font-size:14.5px;color:#C9D2E3}
.kamera .vezerlok{position:absolute;left:0;right:0;bottom:116px;display:flex;align-items:center;justify-content:space-around;padding:0 24px}
.kamera .kis-gomb{width:72px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#C9D2E3}
.kamera .kis-gomb span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.kamera .kis-gomb svg{width:24px;height:24px;fill:currentColor}
.kamera .expo{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;flex:none}
.kamera .expo i{width:60px;height:60px;border-radius:50%;background:#fff;display:block}</style></head><body><script src="v2.js"></script>
<div class="kamera">
<div class="allapot" style="padding:0 18px"></div>
<div class="felso"><span class="kerek">Mégse</span><span class="kap"><img class="avatar" style="width:28px;height:28px" src="../C2_modern/assets/avatar/karakter_1_lapos@2x.png" alt="">Kovács Bence kapja meg</span></div>
<div class="keret"><i></i><i></i><i></i><i></i></div>
<div class="tipp-sor"><b>Még nincs oldal</b><span>Tedd az iratot sötét alapra, és fotózd le.</span></div>
<div class="vezerlok">
<div class="kis-gomb"><span><svg><use href="#i-kep"/></svg></span>Galéria</div>
<div class="expo" role="button" aria-label="Fénykép készítése"><i></i></div>
<div class="kis-gomb"><span><svg><use href="#i-vaku"/></svg></span>Vaku: auto</div>
</div></div>
<nav class="nav" data-aktiv="fotozas" data-pont="uzenetek"></nav>
</body></html>
