<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adózz – Belépés (gép)</title>
<link rel="stylesheet" href="../v2.css">
<link rel="stylesheet" href="v2_asztali.css">
</head>
<body class="asztali osztott-oldal">
<script src="../v2.js"></script>
<div class="osztott">
  <section class="marka-fel">
    <span class="logo" data-meret="44"></span>
    <h1>A saját könyvelőd,<br><em>a zsebedben.</em></h1>
    <div class="elonyok">
      <div class="elony"><div class="tile"><svg><use href="#i-tarca"/></svg></div><span>Látod, mennyit tegyél félre az adóra.</span></div>
      <div class="elony"><div class="tile"><svg><use href="#i-dosszie"/></svg></div><span>A számláid egy helyen vannak, a könyvelőd is látja őket.</span></div>
      <div class="elony"><div class="tile"><svg><use href="#i-naptar-sz"/></svg></div><span>A határidőkre időben figyelmeztetünk.</span></div>
    </div>
  </section>
  <section class="urlap-fel">
    <span class="demo">DEMO</span>
    <div class="urlap-doboz">
      <section class="k blokk">
        <h1 class="urlap-cim">Belépés</h1>
        <label class="mezo-cim">E-mail-cím</label>
        <div class="mezo fokusz"><svg><use href="#i-level"/></svg>szabo.peter@pelda.hu</div>
        <label class="mezo-cim">Jelszó</label>
        <div class="mezo"><svg><use href="#i-lakat"/></svg>••••••••••••<svg class="jobb"><use href="#i-szem"/></svg></div>
        <div style="text-align:right"><a class="link" style="margin-top:10px" href="#">Elfelejtettem a jelszavam</a></div>
        <button class="gomb" style="margin-top:16px">Belépek</button>
        <div class="megj" style="text-align:center;margin:14px 0 0">vagy</div>
        <button class="gomb-masod"><svg><use href="#i-google"/></svg>Belépés Google-fiókkal</button>
      </section>
      <section class="k">
        <div class="tart"><h3>Még nem vagy ügyfél?</h3><p style="margin-top:1px">Pár perc, és kész is vagy.</p></div>
        <button class="gomb-kis masod">Regisztrálok</button>
      </section>
    </div>
  </section>
</div>
</body>
</html>
