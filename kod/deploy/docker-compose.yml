# Kézjegy stack on appok-1 (/srv/kezjegy/deploy/docker-compose.yml) – SPEC §20.2.
# Own compose project, own Postgres + volume, own networks. NO "ports:" anywhere: Docker bypasses ufw,
# so only the proxy publishes 80/443 (SPEC §29.3: kezjegy-proxy, own compose project in proxy/; before the switch the old appok-caddy-1) and reaches kezjegy-api / kezjegy-web over
# the kezjegy_edge network. The database sits on kezjegy_internal (internal: true, no internet).
# Start with: bash /srv/kezjegy/deploy/up.sh   (passes --env-file /srv/kezjegy/.env)
#
# Secrets are split (QA kör 3): /srv/kezjegy/.env holds the app settings and keys and goes to the API and the
# worker; /srv/kezjegy/.env.db holds the database owner's secrets (POSTGRES_PASSWORD, MIGRATION_DATABASE_URL,
# KEZJEGY_APP_DB_PASSWORD) and goes ONLY to kezjegy-db and the one-shot kezjegy-migrate. The API and worker
# connect as the least-privilege role kezjegy_app and never see a superuser credential (deploy/gen-env.sh).
name: kezjegy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kezjegy-db:
    image: postgres:17-alpine
    container_name: kezjegy-db
    restart: unless-stopped
    env_file:
      - path: ../.env.db
        required: true
    environment:
      POSTGRES_USER: kezjegy
      POSTGRES_DB: kezjegy
    volumes:
      - kezjegy_pgdata:/var/lib/postgresql/data
    networks: [kezjegy_internal]
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kezjegy -d kezjegy"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    logging: *logging

  # Migrations as the owner role, once per deploy (up.sh: `compose --profile migrate run --rm kezjegy-migrate`).
  kezjegy-migrate:
    image: kezjegy/api:latest
    container_name: kezjegy-migrate
    profiles: [migrate]
    restart: "no"
    command: ["node", "dist/db/migrate-cli.js"]
    user: "${KEZJEGY_UID:-1001}:${KEZJEGY_GID:-1001}"   # §27.11 S15: KEZJEGY_UID/GID=10001 after the chown in README "Saját uid"
    env_file:
      - path: ../.env.db
        required: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [kezjegy_internal]
    healthcheck:
      disable: true
    depends_on:
      kezjegy-db:
        condition: service_healthy
    mem_limit: 256m
    pids_limit: 64    # SPEC §27.11 S15
    logging: *logging

  kezjegy-api:
    build:
      context: ../src
      dockerfile: backend/Dockerfile
    image: kezjegy/api:latest
    container_name: kezjegy-api
    restart: unless-stopped
    # deploy user of the host (uid/gid 1001): the encrypted blobs in /srv/kezjegy/data/files belong to it.
    user: "${KEZJEGY_UID:-1001}:${KEZJEGY_GID:-1001}"   # §27.11 S15: KEZJEGY_UID/GID=10001 after the chown in README "Saját uid"
    env_file:
      - path: ../.env
        required: true
      # SPEC §29.3.3: public URLs only (APP/PANEL/API/LANDING_PUBLIC_URL, EXTRA_PUBLIC_ORIGINS); the later file wins
      - path: ../nyilvanos.env
        required: false
    environment:
      FILES_DIR: /data/files
      LEGAL_DIR: /app/legal
      FONT_DIR: /app/fonts
      SEED_CREDENTIALS_FILE: /run/seed/demo_belepesek.txt
      # migrations ran in kezjegy-migrate; this role has no DDL rights anyway
      SKIP_MIGRATIONS: "1"
    volumes:
      - ../data/files:/data/files
      # SPEC §31.6: the Google service-account key of the (switched-off) ad measurement; empty folder while it is off
      - ../hirdetes:/run/hirdetes:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # kezjegy_edge: Caddy reaches the API, and outbound internet (NAV, SimplePay, SMTP, Google/Apple JWKS, Expo push).
    networks: [kezjegy_edge, kezjegy_internal]
    depends_on:
      kezjegy-db:
        condition: service_healthy
    mem_limit: 1280m   # round 1 (2026-11-19): 2 uploads at a time (≈ 250 MB each while parsing) + headroom; the server has 12 GB
    pids_limit: 256   # SPEC §27.11 S15
    logging: *logging

  kezjegy-worker:
    image: kezjegy/api:latest
    container_name: kezjegy-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    user: "${KEZJEGY_UID:-1001}:${KEZJEGY_GID:-1001}"   # §27.11 S15: KEZJEGY_UID/GID=10001 after the chown in README "Saját uid"
    env_file:
      - path: ../.env
        required: true
      - path: ../nyilvanos.env
        required: false
    environment:
      SKIP_MIGRATIONS: "1"
      FILES_DIR: /data/files
      LEGAL_DIR: /app/legal
      FONT_DIR: /app/fonts
    volumes:
      - ../data/files:/data/files
      - ../hirdetes:/run/hirdetes:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [kezjegy_edge, kezjegy_internal]
    # The image's HEALTHCHECK probes the API port, which the worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      kezjegy-api:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 128   # SPEC §27.11 S15
    logging: *logging

  kezjegy-web:
    image: caddy:2-alpine
    container_name: kezjegy-web
    restart: unless-stopped
    user: "${KEZJEGY_UID:-1001}:${KEZJEGY_GID:-1001}"   # §27.11 S15: KEZJEGY_UID/GID=10001 after the chown in README "Saját uid"
    volumes:
      - ./web.Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/app:/srv/app:ro
      - ../web/panel:/srv/panel:ro
      # SPEC §26.7.1: videos + guide images (kod/media, uploaded with feltolt.sh --media)
      - ../web/media:/srv/media:ro
      # SPEC §29.3.6: the adozz.hu landing page (kod/landing, uploaded by feltolt.sh)
      - ../web/landing:/srv/landing:ro
    read_only: true
    # Caddy's own state dirs, writable by the non-root user (static only: auto_https/admin are off).
    tmpfs:
      - /data:uid=1001,gid=1001,mode=0700
      - /config:uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [kezjegy_edge]
    mem_limit: 128m
    pids_limit: 64    # SPEC §27.11 S15
    logging: *logging

  # ---------- SPEC §31.1: our own statistics server (Umami, MIT licence, no cookie) ----------
  # The official image pinned to the exact release and digest (ghcr.io/umami-software/umami 3.5.0, index digest checked
  # 2026-11-21 on ghcr.io). Its OWN Postgres (never kezjegy-db: Umami runs its Prisma migrations at every start).
  # Not public: the proxy passes only /m/script.js and POST /m/api/send (proxy/caddy/sites/adozz.caddy); the API reads the
  # aggregates over kezjegy_edge with the read user of umami-beallit.sh. Secrets: /srv/kezjegy/.env.umami(-db) (gen-env.sh).
  # Not read_only: the start script rewrites its own tracker file (update-tracker); no capability, no new privileges.
  kezjegy-umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    container_name: kezjegy-umami
    restart: unless-stopped
    init: true
    env_file:
      - path: ../.env.umami
        required: true
    environment:
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      PRIVATE_MODE: "1"
      # the client address comes from the header the proxy sets from the connection (adozz.caddy)
      CLIENT_IP_HEADER: X-Kj-Client-Ip
      # Adatkezelési tájékoztató 2.17.: the visitor code changes EVERY DAY (UTC midnight); the default would be monthly
      SALT_ROTATION: day
      # the place comes only from the local geo database, never from CDN headers a client could send
      SKIP_LOCATION_HEADERS: "1"
      TZ: UTC
    networks: [kezjegy_edge, kezjegy_umami]
    depends_on:
      kezjegy-umami-db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: 512m
    pids_limit: 128
    logging: *logging

  kezjegy-umami-db:
    image: postgres:17-alpine
    container_name: kezjegy-umami-db
    restart: unless-stopped
    env_file:
      - path: ../.env.umami-db
        required: true
    environment:
      POSTGRES_USER: umami
      POSTGRES_DB: umami
      TZ: UTC
    volumes:
      - kezjegy_umami_pgdata:/var/lib/postgresql/data
    networks: [kezjegy_umami]
    shm_size: 64mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    logging: *logging

networks:
  kezjegy_edge:
    name: kezjegy_edge
  kezjegy_internal:
    name: kezjegy_internal
    internal: true
  # SPEC §31.1: the statistics database has no internet and no neighbour except kezjegy-umami
  kezjegy_umami:
    name: kezjegy_umami
    internal: true

volumes:
  kezjegy_pgdata:
    name: kezjegy_pgdata
  kezjegy_umami_pgdata:
    name: kezjegy_umami_pgdata
